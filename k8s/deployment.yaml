apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-billing
  labels:
    app: service-billing
spec:
  replicas: 2
  selector:
    matchLabels:
      app: service-billing
  template:
    metadata:
      labels:
        app: service-billing
    spec:
      containers:
      - name: service-billing
        #Replace with actual container registry URL
        image: your-registry.com/issueresolutionorg/service-billing:latest
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: service-billing-config
