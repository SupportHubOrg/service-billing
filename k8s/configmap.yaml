apiVersion: v1
kind: ConfigMap
metadata:
  name: billing-service-config
data:
  NODE_ENV: "production"
  PORT: "5002"
  #Route traffic to the internal Kubernetes Kafka service
  KAFKA_BROKER: "kafka-cluster-kafka-bootstrap:9092"
  KAFKA_TOPIC_READ_ORG: "organization-access-events"
  KAFKA_TOPIC_WRITE: "billing-events"
  #Replace with the internal cluster Gateway URL or the public frontend domain
  FRONTEND_URL: "http://api-gateway.default.svc.cluster.local:3000"